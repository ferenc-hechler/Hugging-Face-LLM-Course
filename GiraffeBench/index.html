<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Walking Giraffe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instructions">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>

    <!-- Import Map allows us to use ES modules from a CDN without a local server -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration & Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky Blue
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 2, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -20;
        sunLight.shadow.camera.right = 20;
        sunLight.shadow.camera.top = 20;
        sunLight.shadow.camera.bottom = -20;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- Environment ---
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a5f0b }); // Grass Green
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Giraffe Texture Generation ---
        function createGiraffeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Base color (Tan/Wheat)
            ctx.fillStyle = '#F5DEB3';
            ctx.fillRect(0, 0, 512, 512);

            // Draw random brown spots
            ctx.fillStyle = '#8B4513'; // Saddle Brown
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const radius = Math.random() * 35 + 15;
                
                ctx.beginPath();
                ctx.ellipse(x, y, radius, radius * 0.8, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const giraffeTexture = createGiraffeTexture();
        const skinMat = new THREE.MeshStandardMaterial({ 
            map: giraffeTexture,
            roughness: 0.8 
        });

        // --- Giraffe Construction ---
        const giraffe = new THREE.Group();
        scene.add(giraffe);

        // Body (Capsule)
        // CapsuleGeometry(radius, length, ...) -> total height = length + 2*radius
        // radius=1, length=2 -> total length = 4.
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(1, 2, 4, 12), skinMat);
        body.rotation.z = Math.PI / 2; // Make it horizontal
        body.position.set(0, 5, 0);    // Center of body
        body.castShadow = true;
        giraffe.add(body);

        // Neck Group (to allow rotation from the base)
        const neckGroup = new THREE.Group();
        // Position at the front end of the horizontal body (x = 2)
        neckGroup.position.set(2, 5, 0); 
        giraffe.add(neckGroup);

        // Neck Mesh
        const neck = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 3, 4, 12), skinMat);
        // Offset so the base is at the group's origin (0,0,0)
        // Since the capsule is vertical by default, we need to offset it by half its height (1.9)
        neck.position.set(0, 1.9, 0); 
        neck.castShadow = true;
        neckGroup.add(neck);

        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), skinMat);
        head.position.set(0, 3.8, 0); // At the top of the neck
        head.castShadow = true;
        neckGroup.add(head);

        // Ossicones (Horns)
        const ossiconeGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5, 8);
        const ossicone1 = new THREE.Mesh(ossiconeGeo, skinMat);
        ossicone1.position.set(0, 0.4 + 0.25, 0.25); // Relative to head
        head.add(ossicone1);
        const ossicone2 = new THREE.Mesh(ossiconeGeo, skinMat);
        ossicone2.position.set(0, 0.4 + 0.25, -0.25); // Relative to head
        head.add(ossicone2);

        // Legs
        const legGeo = new THREE.CylinderGeometry(0.15, 0.1, 3, 12);
        legGeo.translate(0, -1.5, 0); // Move pivot to top of cylinder

        const legs = [];
        const createLeg = (x, y, z) => {
            const leg = new THREE.Mesh(legGeo, skinMat);
            leg.position.set(x, y, z); // Top of leg at y
            leg.castShadow = true;
            giraffe.add(leg);
            return leg;
        };

        // Legs attached to the bottom of the horizontal body (y = 5 - radius = 4)
        const fl = createLeg(1, 4, 0.6);   // Front Left
        const br = createLeg(-1, 4, -0.6); // Back Right
        const fr = createLeg(1, 4, -0.6);  // Front Right
        const bl = createLeg(-1, 4, 0.6);  // Back Left
        legs.push(fl, br, fr, bl);

        // --- Animation Logic ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            
            const walkSpeed = 4;
            const walkAmplitude = 0.4;

            // 1. Leg Movement
            fl.rotation.x = Math.sin(elapsed * walkSpeed) * walkAmplitude;
            br.rotation.x = Math.sin(elapsed * walkSpeed) * walkAmplitude;
            fr.rotation.x = Math.sin(elapsed * walkSpeed + Math.PI) * walkAmplitude;
            bl.rotation.x = Math.sin(elapsed * walkSpeed + Math.PI) * walkAmplitude;

            // 2. Body Bobbing
            body.position.y = 5 + Math.sin(elapsed * walkSpeed * 2) * 0.05;

            // 3. Neck Sway
            // Rotate around X axis to make it sway up/down relative to the horizontal body
            neckGroup.rotation.x = Math.sin(elapsed * walkSpeed) * 0.1;

            // 4. Movement
            giraffe.position.z = (elapsed * 2) % 60 - 30;
            giraffe.rotation.y = Math.sin(elapsed * walkSpeed) * 0.02;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

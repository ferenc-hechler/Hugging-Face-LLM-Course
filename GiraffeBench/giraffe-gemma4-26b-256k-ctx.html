<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Walking Giraffe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="ui">Procedural Giraffe (No-Server Mode)</div>

    <!-- Using Import Maps to load Three.js from CDN without a build step -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURATION ---
        const CONFIG = {
            speed: 2.5,
            stride: 0.5,
            bodyColor: '#F5DEB3', // Wheat/Tan
            spotColor: '#8B4513', // SaddleBrown
        };

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // --- PROCEDURAL TEXTURE GENERATION ---
        // We create a canvas to draw giraffe spots so we don't need external images
        function createGiraffeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Base color
            ctx.fillStyle = CONFIG.bodyColor;
            ctx.fillRect(0, 0, 512, 512);

            // Draw random spots
            ctx.fillStyle = CONFIG.spotColor;
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = 10 + Math.random() * 40;
                ctx.beginPath();
                ctx.ellipse(x, y, r, r * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }
        const giraffeTexture = createGiraffeTexture();
        const giraffeMaterial = new THREE.MeshStandardMaterial({ map: giraffeTexture });

        // --- GIRAFFE CONSTRUCTION ---
        const giraffe = new THREE.Group();
        scene.add(giraffe);

        // Body
        const bodyGeom = new THREE.CapsuleGeometry(1, 2, 4, 8);
        const body = new THREE.Mesh(bodyGeom, giraffeMaterial);
        body.rotation.z = Math.PI / 2;
        body.castShadow = true;
        giraffe.add(body);

        // Neck
        const neckGeom = new THREE.CylinderGeometry(0.4, 0.7, 4, 8);
        const neck = new THREE.Mesh(neckGeom, giraffeMaterial);
        neck.position.set(1.8, 2, 0);
        neck.rotation.z = -0.2;
        neck.castShadow = true;
        giraffe.add(neck);

        // Head
        const headGeom = new THREE.CapsuleGeometry(0.4, 0.8, 4, 8);
        const head = new THREE.Mesh(headGeom, giraffeMaterial);
        head.position.set(3, 4.2, 0);
        head.rotation.z = Math.PI / 2;
        head.castShadow = true;
        giraffe.add(head);

        // Ossicones (Horns)
        const hornGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8);
        const hornL = new THREE.Mesh(hornGeom, giraffeMaterial);
        hornL.position.set(3, 4.7, 0.2);
        giraffe.add(hornL);
        const hornR = hornL.clone();
        hornR.position.z = -0.2;
        giraffe.add(hornR);

        // Legs (Grouping for animation pivots)
        // We create a "Joint" group so the leg rotates from the top
        const createLeg = (x, z) => {
            const group = new THREE.Group();
            group.position.set(x, -1, z);

            const legGeom = new THREE.CylinderGeometry(0.15, 0.1, 3, 8);
            const leg = new THREE.Mesh(legGeom, giraffeMaterial);
            leg.position.y = -1.5; // Offset mesh so group pivot is at top
            leg.castShadow = true;

            group.add(leg);
            return group;
        };

        const legFL = createLeg(1, 0.6);  // Front Left
        const legFR = createLeg(1, -0.6); // Front Right
        const legBL = createLeg(-1, 0.6); // Back Left
        const legBR = createLeg(-1, -0.6); // Back Right

        giraffe.add(legFL, legFR, legBL, legBR);

        // --- ENVIRONMENT ---
        // Grass/Ground
        const groundGeom = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -3;
        ground.receiveShadow = true;
        scene.add(ground);

        // Simple Trees
        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x8B4513}));
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 4, 8), new THREE.MeshStandardMaterial({color: 0x006400}));
            leaves.position.y = 2.5;
            tree.add(trunk, leaves);
            tree.position.set(x, -2, z);
            scene.add(tree);
        }

        for(let i=0; i<20; i++) {
            createTree(Math.random()*80-40, Math.random()*80-40);
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime() * CONFIG.speed;

            // Walking Gait Logic
            // We use sine waves with phase shifts to simulate a walk
            // Front-Left and Back-Right move together
            // Front-Right and Back-Left move together

            const gait = (time) => Math.sin(time) * CONFIG.stride;

            legFL.rotation.x = gait(t);
            legBR.rotation.x = gait(t);

            legFR.rotation.x = gait(t + Math.PI);
            legBL.rotation.x = gait(t + Math.PI);

            // Body bobbing
            giraffe.position.y = Math.abs(Math.sin(t * 2)) * 0.1;

            // Neck swaying
            neck.rotation.y = Math.sin(t * 0.5) * 0.1;
            head.rotation.x = Math.sin(t * 0.5) * 0.1;

            // Movement: Make the giraffe move forward in a loop (or just stay in place and move world)
            // For simplicity, we'll keep the giraffe at origin but move the trees/ground
            // to simulate movement, OR just move the giraffe and wrap around.
            // Let's just make the giraffe walk in a circle.
            const radius = 15;
            giraffe.position.x = Math.cos(t * 0.2) * radius;
            giraffe.position.z = Math.sin(t * 0.2) * radius;
            giraffe.rotation.y = -t * 0.2 + Math.PI/2;

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Giraffe - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: sans-serif;
            color: #333;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>Procedural Walking Giraffe</strong><br>
        No server needed. Pure Three.js + Canvas Textures.
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const COLORS = {
            skin: '#dfb65d',
            spots: '#8b5a2b',
            ground: '#567d46'
        };

        // --- Texture Generator ---
        // Since we can't load images from a server, we draw a spotty pattern on a canvas
        function createGiraffeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = COLORS.skin;
            ctx.fillRect(0, 0, 256, 256);

            ctx.fillStyle = COLORS.spots;
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const r = Math.random() * 15 + 5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 3, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        scene.add(sunLight);

        // --- Environment ---
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: COLORS.ground });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Giraffe Construction ---
        const giraffeTexture = createGiraffeTexture();
        const giraffeMat = new THREE.MeshStandardMaterial({ map: giraffeTexture });

        const giraffe = new THREE.Group();
        scene.add(giraffe);

        // Body
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 3), giraffeMat);
        body.position.y = 3.5;
        body.castShadow = true;
        giraffe.add(body);

        // Neck
        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 4, 0.6), giraffeMat);
        neck.position.set(0, 4.5, 1.5);
        neck.rotation.x = -0.2;
        neck.castShadow = true;
        giraffe.add(neck);

        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.2), giraffeMat);
        head.position.set(0, 6.5, 2.1);
        head.castShadow = true;
        giraffe.add(head);

        // Legs setup
        const legs = [];
        const legGeo = new THREE.BoxGeometry(0.3, 3, 0.3);
        const legPositions = [
            { x: 0.5, z: 1.2 },  // Front Left
            { x: -0.5, z: 1.2 }, // Front Right
            { x: 0.5, z: -1.2 }, // Back Left
            { x: -0.5, z: -1.2 } // Back Right
        ];

        legPositions.forEach((pos, index) => {
            const legPivot = new THREE.Group();
            legPivot.position.set(pos.x, 2.5, pos.z);

            const legMesh = new THREE.Mesh(legGeo, giraffeMat);
            legMesh.position.y = -1.5; // Offset mesh so it rotates around the top
            legMesh.castShadow = true;

            legPivot.add(legMesh);
            giraffe.add(legPivot);
            legs.push(legPivot);
        });

        // Tail
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 0.1), giraffeMat);
        tail.position.set(0, 3, -1.6);
        tail.rotation.x = 0.5;
        giraffe.add(tail);

        // --- Animation Logic ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const speed = 2.5;
            const amplitude = 0.4;

            // 1. Leg Movement (Walking Cycle)
            // Front-Left and Back-Right move together
            // Front-Right and Back-Left move together
            legs.forEach((leg, i) => {
                const offset = (i === 1 || i === 2) ? Math.PI : 0;
                leg.rotation.x = Math.sin(t * speed + offset) * amplitude;
            });

            // 2. Body Bobbing
            body.position.y = 3.5 + Math.sin(t * speed * 2) * 0.1;

            // 3. Neck Sway
            neck.rotation.z = Math.sin(t * speed) * 0.05;
            neck.rotation.x = -0.2 + Math.sin(t * speed) * 0.05;

            // 4. Head bob
            head.position.y = 6.5 + Math.sin(t * speed * 2) * 0.05;
            head.rotation.z = Math.sin(t * speed) * 0.05;

            // 5. Move giraffe forward
            giraffe.position.z = (t * 2) % 20 - 10;

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
